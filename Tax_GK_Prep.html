<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Knowledge Preparation - Tax Office</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        :root {
            --gk-primary: #d35400;
            --gk-secondary: #2c3e50;
            --success: #27ae60;
        }

        body {
            font-family: 'SolaimanLipi', Arial, sans-serif;
            background: radial-gradient(circle, #2c3e50, #000);
            color: #fff;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 30px;
            background: rgba(211, 84, 0, 0.2);
            border-radius: 20px;
            margin-bottom: 40px;
            border: 1px solid var(--gk-primary);
            animation: fadeInDown 1s;
        }

        .quiz-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .quiz-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.02) rotateZ(0.5deg);
            box-shadow: 0 0 20px rgba(211, 84, 0, 0.4);
        }

        .question {
            font-size: 1.15rem;
            color: #ecf0f1;
            margin-bottom: 15px;
            border-left: 4px solid var(--gk-primary);
            padding-left: 10px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #ecf0f1;
            color: #2c3e50;
            font-weight: bold;
        }

        button {
            padding: 10px 25px;
            background: var(--gk-primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { background: #e67e22; }

        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            animation: flipInX 0.5s;
        }

        .correct { background: rgba(39, 174, 96, 0.3); border: 1px solid var(--success); }
        .wrong { background: rgba(192, 57, 43, 0.3); border: 1px solid #c0392b; }

        .explanation {
            display: block;
            margin-top: 8px;
            font-size: 0.9rem;
            color: #bdc3c7;
        }

        /* 3D World Map Background Effect */
        .globe-bg {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 500px;
            opacity: 0.03;
            z-index: -1;
            animation: rotateGlobe 60s infinite linear;
        }

        @keyframes rotateGlobe {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="globe-bg">🌍</div>

    <div class="container">
        <div class="header">
            <h1>🌏 সাধারণ জ্ঞান (বাংলাদেশ ও আন্তর্জাতিক)</h1>
            <p>কর অঞ্চল নোয়াখালী ও সরকারি নিয়োগ প্রস্তুতি ২০২৬</p>
        </div>
        <div id="quiz-list"></div>
    </div>

    <script>
        const questions = [
            {q: "১. বাংলাদেশের একমাত্র প্রবাল দ্বীপ কোনটি?", a: "সেন্টমার্টিন", e: "এটি কক্সবাজার জেলায় অবস্থিত যা নারিকেল জিঞ্জিরা নামেও পরিচিত।"},
            {q: "২. বর্তমান বিশ্বের বৃহত্তম অর্থনীতির দেশ কোনটি?", a: "যুক্তরাষ্ট্র", e: "জিডিপি অনুযায়ী যুক্তরাষ্ট্র শীর্ষ স্থানে রয়েছে।"},
            {q: "৩. নিঝুম দ্বীপ কোন জেলায় অবস্থিত?", a: "নোয়াখালী", e: "নোয়াখালী জেলার হাতিয়া উপজেলায় অবস্থিত যা হরিণের জন্য বিখ্যাত।"},
            {q: "৪. বাংলাদেশের জাতীয় ফল কোনটি?", a: "কাঁঠাল", e: "এটি বাংলাদেশের জাতীয় ফল এবং বেশ পুষ্টিকর।"},
            {q: "৫. ইউক্রেনের রাজধানীর নাম কী?", a: "কিয়েভ", e: "চলমান রাশিয়া-ইউক্রেন সংকটের কারণে এটি আন্তর্জাতিকভাবে গুরুত্বপূর্ণ।"},
            {q: "৬. বাংলাদেশের সংবিধান কার্যকর হয় কবে?", a: "১৬ ডিসেম্বর ১৯৭২", e: "এটি ১৬ই ডিসেম্বর বিজয় দিবস থেকে কার্যকর হয়।"},
            {q: "৭. পদ্মা সেতুর দৈর্ঘ্য কত কিমি?", a: "৬.১৫", e: "এটি মুন্সিগঞ্জ ও শরীয়তপুর জেলাকে যুক্ত করেছে।"},
            {q: "৮. আয়তনে বিশ্বের বৃহত্তম দেশ কোনটি?", a: "রাশিয়া", e: "এশিয়া ও ইউরোপ উভয় মহাদেশে রাশিয়ার অবস্থান।"},
            {q: "৯. নোয়াখালীর প্রাচীন নাম কী ছিল?", a: "ভুলুয়া", e: "প্রাচীন আমলে নোয়াখালী অঞ্চল ভুলুয়া রাজ্য নামে পরিচিত ছিল।"},
            {q: "১০. জাতিসংঘের বর্তমান মহাসচিবের নাম কী?", a: "আন্তোনিও গুতেরেস", e: "তিনি পর্তুগালের নাগরিক।"},
            {q: "১১. মুজিবনগর সরকার কবে শপথ গ্রহণ করে?", a: "১৭ এপ্রিল ১৯৭১", e: "মেহেরপুরের বৈদ্যনাথতলায় এই সরকার শপথ নেয়।"},
            {q: "১২. বাংলাদেশের সর্বোচ্চ পর্বতশৃঙ্গের নাম কী?", a: "তাজিংডং", e: "বিজয় নামেও পরিচিত এটি বান্দরবান জেলায় অবস্থিত।"},
            {q: "১৩. 'সবুজ দ্বীপ' বলা হয় কোন দেশকে?", a: "আয়ারল্যান্ড", e: "প্রাকৃতিক সৌন্দর্যের কারণে আয়ারল্যান্ডকে এই নামে ডাকা হয়।"},
            {q: "১৪. ইন্টারপোল (INTERPOL) এর সদর দপ্তর কোথায়?", a: "লিওঁ", e: "ফ্রান্সের লিওঁ শহরে এর সদর দপ্তর অবস্থিত।"},
            {q: "১৫. বাংলাদেশ কত সালে ওআইসি (OIC) এর সদস্যপদ লাভ করে?", a: "১৯৭৪", e: "বঙ্গবন্ধু শেখ মুজিবুর রহমানের নেতৃত্বে ওআইসি সদস্য হয়।"},
            {q: "১৬. রাশিয়ার মুদ্রার নাম কী?", a: "রুবল", e: "এটি রাশিয়ার রাষ্ট্রীয় মুদ্রা।"},
            {q: "১৭. সূর্যোদয়ের দেশ বলা হয় কোনটিকে?", a: "জাপান", e: "পূর্বদিকের ভৌগোলিক অবস্থানের কারণে একে সূর্যোদয়ের দেশ বলে।"},
            {q: "১৮. বঙ্গবন্ধু স্যাটেলাইট-১ কবে উৎক্ষেপণ করা হয়?", a: "১২ মে ২০১৮", e: "যুক্তরাষ্ট্রের ফ্লোরিডা থেকে এটি উৎক্ষেপণ করা হয়।"},
            {q: "১৯. মঙ্গুডু কোন দেশের সীমান্তবর্তী শহর?", a: "মিয়ানমার", e: "বাংলাদেশ-মিয়ানমার সীমান্তে এটি অবস্থিত।"},
            {q: "২০. পৃথিবীর ফুসফুস বলা হয় কোন বনকে?", a: "আমাজন", e: "বিশ্বের ২০% অক্সিজেন এই বন থেকে আসে।"},
            {q: "২১. বাংলাদেশের জাতীয় সংসদ ভবন কে ডিজাইন করেন?", a: "লুই আই কান", e: "তিনি একজন বিখ্যাত মার্কিন স্থপতি ছিলেন।"},
            {q: "২২. কত সালে বঙ্গভঙ্গ রদ করা হয়?", a: "১৯১১", e: "১৯০৫ সালে বঙ্গভঙ্গ হয়েছিল এবং ১৯১১ সালে তা রদ হয়।"},
            {q: "২৩. 'স্ট্যাচু অফ লিবার্টি' কোথায় অবস্থিত?", a: "নিউইয়র্ক", e: "এটি ফ্রান্স উপহার হিসেবে যুক্তরাষ্ট্রকে দিয়েছিল।"},
            {q: "২৪. বাংলাদেশ কত সালে টেস্ট স্ট্যাটাস পায়?", a: "২০০০", e: "২৬ জুন ২০০০ সালে বাংলাদেশ এই স্বীকৃতি পায়।"},
            {q: "২৫. নোয়াখালীতে কোন নদী প্রবাহিত?", a: "মেঘনা", e: "মেঘনা ও ডাকাতিয়া নদী এই জেলার পাশ দিয়ে প্রবাহিত।"},
            {q: "২৬. ব্রিকস (BRICS) এর বর্তমান সদস্য দেশ কয়টি?", a: "১০", e: "২০২৪ সালে নতুন কয়েকটি দেশ যুক্ত হয়ে সংখ্যাটি ১০ হয়েছে।"},
            {q: "২৭. বাংলাদেশের বৃহত্তম হাওর কোনটি?", a: "হাকালুকি", e: "এটি মৌলভীবাজার ও সিলেট জেলায় অবস্থিত।"},
            {q: "২৮. ইউরোপীয় ইউনিয়নের সদর দপ্তর কোথায়?", a: "ব্রাসেলস", e: "বেলজিয়ামের রাজধানী ব্রাসেলসে এর অবস্থান।"},
            {q: "২৯. কম্পিউটারের মস্তিষ্ক বলা হয় কোনটিকে?", a: "সিপিইউ", e: "CPU (Central Processing Unit) কম্পিউটারের প্রধান অংশ।"},
            {q: "৩০. বাংলাদেশের হোয়াইট গোল্ড (White Gold) কোনটি?", a: "চিংড়ি", e: "বৈদেশিক মুদ্রা অর্জনে ভূমিকার জন্য একে এই নামে ডাকা হয়।"},
            {q: "৩১. জাপানের পার্লামেন্টের নাম কী?", a: "ডায়েট", e: "বিশ্বের অন্যতম প্রাচীন আইনসভা।"},
            {q: "৩২. বাংলাদেশের একমাত্র পাহাড়ি দ্বীপ কোনটি?", a: "মহেশখালী", e: "কক্সবাজার জেলায় এটি অবস্থিত।"},
            {q: "৩৩. ফিলিস্তিনের স্বাধীনতাকামী সংগঠনের নাম কী?", a: "হামাস", e: "গাজা উপত্যকা ভিত্তিক এই সংগঠন বর্তমানে আলোচিত।"},
            {q: "৩৪. রূপপুর পারমাণবিক বিদ্যুৎ কেন্দ্র কোথায় অবস্থিত?", a: "পাবনা", e: "ঈশ্বরদী উপজেলার রূপপুরে এটি নির্মাণাধীন।"},
            {q: "৩৫. বিশ্বের সবচেয়ে বড় মহাদেশ কোনটি?", a: "এশিয়া", e: "জনসংখ্যা ও আয়তন উভয় দিক থেকেই এটি বৃহত্তম।"},
            {q: "৩৬. বাংলাদেশের কোন জেলায় সবচেয়ে বেশি চা বাগান আছে?", a: "মৌলভীবাজার", e: "সিলেট বিভাগীয় এই জেলায় সর্বোচ্চ বাগান রয়েছে।"},
            {q: "৩৭. সার্ক (SAARC) এর সদর দপ্তর কোথায়?", a: "কাঠমান্ডু", e: "নেপালের রাজধানী কাঠমান্ডুতে এটি অবস্থিত।"},
            {q: "৩৮. মুক্তিযুদ্ধের সময় বাংলাদেশকে কয়টি সেক্টরে ভাগ করা হয়?", a: "১১", e: "নোয়াখালী ২ নং সেক্টরের অধীনে ছিল।"},
            {q: "৩৯. মেক্সিকো কোন মহাদেশের দেশ?", a: "উত্তর আমেরিকা", e: "এটি উত্তর আমেরিকা মহাদেশের দক্ষিণ অংশে অবস্থিত।"},
            {q: "৪০. বাংলা ভাষার জন্য কত সালে আন্দোলন হয়?", a: "১৯৫২", e: "২১শে ফেব্রুয়ারি এই ঐতিহাসিক দিনটি পালন করা হয়।"},
            {q: "৪১. লোহিত সাগর ও ভূমধ্যসাগরকে যুক্ত করেছে কোনটি?", a: "সুয়েজ খাল", e: "এটি আন্তর্জাতিক বাণিজ্যের একটি গুরুত্বপূর্ণ পথ।"},
            {q: "৪২. জাতীয় কর দিবস পালন করা হয় কবে?", a: "৩০ নভেম্বর", e: "করদাতাদের উৎসাহিত করতে এই দিনটি পালিত হয়।"},
            {q: "৪৩. বাংলাদেশের বর্তমান রাষ্ট্রপতির নাম কী?", a: "মোহাম্মদ সাহাবুদ্দিন", e: "তিনি বাংলাদেশের ২২তম রাষ্ট্রপতি।"},
            {q: "৪৪. জি-২০ (G20) এর পরবর্তী সম্মেলন কোথায় হবে?", a: "ব্রাজিল", e: "২০২৪ সালের সম্মেলন ব্রাজিলে অনুষ্ঠিত হচ্ছে।"},
            {q: "৪৫. বাংলাদেশের সর্ব দক্ষিণের থানা কোনটি?", a: "টেকনাফ", e: "কক্সবাজার জেলার একটি থানা।"},
            {q: "৪৬. ফরাসি বিপ্লব কত সালে সংগঠিত হয়?", a: "১৭৮৯", e: "সাম্য, মৈত্রী ও স্বাধীনতার স্লোগান নিয়ে এটি শুরু হয়।"},
            {q: "৪৭. বাংলাদেশের কেন্দ্রীয় ব্যাংকের নাম কী?", a: "বাংলাদেশ ব্যাংক", e: "এটি দেশের মুদ্রানীতি নিয়ন্ত্রণ করে।"},
            {q: "৪৮. বিশ্বের দীর্ঘতম সমুদ্র সৈকত কোনটি?", a: "কক্সবাজার", e: "এর দৈর্ঘ্য প্রায় ১২০ কিলোমিটার।"},
            {q: "৪৯. এভারেস্ট জয়ী প্রথম বাংলাদেশি নারী কে?", a: "নিশাত মজুমদার", e: "২০১২ সালের ১৯ মে তিনি এভারেস্ট জয় করেন।"},
            {q: "৫০. কর অঞ্চল নোয়াখালীর অধীনে কোন জেলাগুলো রয়েছে?", a: "নোয়াখালী, ফেনী ও লক্ষ্মীপুর", e: "এই তিনটি জেলা নিয়ে কর অঞ্চল নোয়াখালী গঠিত।"}
        ];

        function init() {
            const list = document.getElementById('quiz-list');
            questions.forEach((data, i) => {
                const card = document.createElement('div');
                card.className = 'quiz-card animate__animated animate__fadeInUp';
                card.style.animationDelay = (i * 0.1) + 's';
                card.innerHTML = `
                    <div class="question">${data.q}</div>
                    <div class="input-group">
                        <input type="text" id="ans-${i}" placeholder="উত্তর এখানে লিখুন...">
                        <button onclick="check(${i})">সাবমিট</button>
                    </div>
                    <div id="fb-${i}" class="feedback">
                        <strong id="res-${i}"></strong><br>
                        <span class="explanation">🔍 ব্যাখ্যা: ${data.e}</span>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        window.check = function(i) {
            const val = document.getElementById(`ans-${i}`).value.trim();
            const fb = document.getElementById(`fb-${i}`);
            const res = document.getElementById(`res-${i}`);
            
            fb.style.display = 'block';
            if(val === questions[i].a || val === questions[i].a.replace('১১', '11')) {
                fb.className = 'feedback correct animate__animated animate__heartBeat';
                res.innerText = "✅ সঠিক উত্তর!";
            } else {
                fb.className = 'feedback wrong animate__animated animate__shakeX';
                res.innerText = `❌ ভুল! সঠিক উত্তর: ${questions[i].a}`;
            }
        }

        window.onload = init;
    </script>
</body>
</html>
